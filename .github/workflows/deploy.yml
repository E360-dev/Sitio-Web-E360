name: Desplegar a SiteGround

on:
  # Despliegue de producción al integrar cambios en main.
  push:
    branches: [main]
  # Botón manual, para volver a desplegar sin cambios de código.
  workflow_dispatch:
  # Lo usará la Fase 3: al publicar un artículo, Supabase dispara este evento
  # para que el sitio se reconstruya con el contenido nuevo.
  repository_dispatch:
    types: [contenido-actualizado]

# Tres publicaciones seguidas producen una sola compilación, no tres.
concurrency:
  group: despliegue-produccion
  cancel-in-progress: true

jobs:
  desplegar:
    name: Compilar y sincronizar
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar
        # npm run build encadena tres pasos: descarga los artículos publicados
        # de Supabase, compila, y prerenderiza cada ruta a HTML con Puppeteer.
        run: npm run build

      - name: Comprobar que el build es válido
        # Evita desplegar un directorio vacío o a medias si algo falló en silencio.
        run: |
          test -f dist/index.html || { echo "ERROR: no se generó dist/index.html"; exit 1; }
          test -d dist/assets   || { echo "ERROR: no se generó dist/assets"; exit 1; }
          test -f dist/.htaccess || echo "AVISO: no hay .htaccess en el build; se conservará el del servidor"
          test -f dist/sitemap.xml || { echo "ERROR: no se generó el sitemap"; exit 1; }

          # Las páginas prerenderizadas deben llevar contenido real, no solo el
          # esqueleto de la SPA: es lo único que ven Google y LinkedIn.
          grep -q "E360 Comunica" dist/comunica/index.html \
            || { echo "ERROR: /comunica no se prerenderizó con contenido"; exit 1; }

          echo "Rutas prerenderizadas:"
          find dist -name index.html | sed "s|dist||;s|/index.html|/|"
          echo "Contenido a desplegar:"
          du -sh dist

      - name: Configurar la clave SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_despliegue
          chmod 600 ~/.ssh/id_despliegue
          ssh-keyscan -p "${{ secrets.SSH_PORT }}" -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Comprobar la ruta de destino
        # DEPLOY_PATH mal puesto significaría escribir el sitio en el sitio
        # equivocado. Aquí se verifica que el destino existe y que parece el
        # directorio público del sitio, antes de transferir un solo archivo.
        run: |
          SSH="ssh -i ~/.ssh/id_despliegue -p ${{ secrets.SSH_PORT }} -o StrictHostKeyChecking=yes"
          DESTINO="${{ secrets.DEPLOY_PATH }}"
          $SSH "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "test -d '$DESTINO' || { echo 'ERROR: la ruta no existe en el servidor'; exit 1; }
             test -f '$DESTINO/index.html' || { echo 'ERROR: la ruta existe pero no contiene index.html; revisa DEPLOY_PATH'; exit 1; }
             echo 'Destino verificado:'; ls -la '$DESTINO' | head -12"

      - name: Sincronizar el sitio
        # --checksum compara contenido en lugar de fecha: el build reescribe los
        # videos e imágenes con mtime nuevo aunque no hayan cambiado, y sin esto
        # se resubirían 25 MB en cada despliegue.
        # Sin --delete: en la raíz puede haber archivos que no gestiona el repo.
        run: |
          rsync -avz --checksum --human-readable \
            -e "ssh -i ~/.ssh/id_despliegue -p ${{ secrets.SSH_PORT }} -o StrictHostKeyChecking=yes" \
            dist/ "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/"

      - name: Limpiar assets de despliegues antiguos
        # Se conservan los assets del despliegue ANTERIOR además de los del actual.
        #
        # Motivo: borrarlos en el mismo despliegue que sube los nuevos deja una
        # ventana en la que un navegador con la página ya abierta —o con el HTML
        # aún cacheado— pide un chunk que acaba de desaparecer, y ve una pantalla
        # en blanco. Pasó en el primer despliegue.
        #
        # Se lleva un manifiesto en el servidor con la lista de cada despliegue;
        # se borra solo lo que no está ni en el actual ni en el anterior.
        run: |
          SSH="ssh -i ~/.ssh/id_despliegue -p ${{ secrets.SSH_PORT }} -o StrictHostKeyChecking=yes"
          DESTINO="${{ secrets.DEPLOY_PATH }}"
          SERVIDOR="${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}"

          # El manifiesto del despliegue anterior pasa a ser el histórico.
          $SSH "$SERVIDOR" "cd '$DESTINO/assets' && { [ -f .manifiesto ] && mv .manifiesto .manifiesto-anterior; } || true"

          # Manifiesto del despliegue actual.
          ls dist/assets > manifiesto.txt
          scp -i ~/.ssh/id_despliegue -P "${{ secrets.SSH_PORT }}" -o StrictHostKeyChecking=yes \
            manifiesto.txt "$SERVIDOR:$DESTINO/assets/.manifiesto"

          # Borrar lo que no aparece en ninguno de los dos.
          $SSH "$SERVIDOR" "
            cd '$DESTINO/assets' || exit 1
            cat .manifiesto .manifiesto-anterior 2>/dev/null | sort -u > .conservar
            borrados=0
            for f in *; do
              [ -f \"\$f\" ] || continue
              if ! grep -qxF \"\$f\" .conservar; then
                rm -f \"\$f\" && borrados=\$((borrados+1))
              fi
            done
            rm -f .conservar
            echo \"Assets eliminados de despliegues antiguos: \$borrados\"
            echo \"Assets en el servidor: \$(ls | wc -l)\"
          "

      - name: Comprobar que el sitio publicado sirve el build nuevo
        # En el primer despliegue, la caché dinámica de SiteGround siguió
        # sirviendo el HTML viejo, que apuntaba a un asset ya borrado: pantalla
        # en blanco sin que nada fallara. Este paso convierte ese fallo
        # silencioso en un error visible.
        #
        # El .htaccess ya envía Cache-Control: no-cache en el HTML, así que no
        # debería repetirse. Si vuelve a pasar, aquí se verá.
        run: |
          ESPERADO=$(ls dist/assets/index-*.js | head -1 | xargs basename)
          echo "Esperando en producción: $ESPERADO"

          for intento in 1 2 3 4 5; do
            # -L sigue redirecciones: durante el reemplazo del .htaccess la
            # respuesta puede ser un 301 momentáneo, y sin esto el cuerpo llega
            # vacío y el fallo resulta imposible de diagnosticar.
            CUERPO=$(curl -sL --max-time 20 -w '\nCODIGO:%{http_code}' \
                     "https://e360.pro/?despliegue=$GITHUB_RUN_ID" || true)
            CODIGO=$(printf '%s' "$CUERPO" | tail -1 | cut -d: -f2)
            SERVIDO=$(printf '%s' "$CUERPO" | grep -o 'assets/index-[^"]*\.js' | head -1 | xargs -r basename)

            echo "  intento $intento: HTTP ${CODIGO:-?} · ${SERVIDO:-(sin referencia al bundle)}"
            [ "$SERVIDO" = "$ESPERADO" ] && { echo "OK: producción sirve el build recién desplegado."; exit 0; }
            sleep 10
          done

          echo ""
          echo "ERROR: producción no sirve el build recién desplegado."
          echo "  esperado: $ESPERADO"
          echo "  servido:  ${SERVIDO:-(nada)} con HTTP ${CODIGO:-?}"
          echo ""
          echo "Si el código es 200 y el bundle es otro, es la caché:"
          echo "  Site Tools -> Velocidad -> Caché -> vaciar la caché dinámica."
          echo "Si el código es 3xx, 4xx o 5xx, revisa el .htaccess desplegado."
          exit 1

      - name: Borrar la clave
        if: always()
        run: rm -f ~/.ssh/id_despliegue
